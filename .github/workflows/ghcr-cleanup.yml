name: GHCR Cleanup

permissions: {}

on:
  schedule:
    - cron: "0 1 * * 0" # Every Sunday at 01:00 AM UTC
  workflow_dispatch:
    inputs:
      DRY_RUN:
        default: true
        type: boolean

jobs:
  ghcr-cleanup:
    name: GHCR cleanup
    uses: dargmuesli/github-actions/.github/workflows/ghcr-cleanup.yml@ab8e226263168a9aab8c98d6db89ce707f77497e # 5.11.0
    permissions:
      packages: write
    with:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.DRY_RUN }}
