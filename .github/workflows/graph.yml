name: Graph

permissions: {}

on:
  push:
    branches:
      - main
    paths:
      - src/**
  workflow_dispatch:

env:
  # renovate: datasource=deb distro=ubuntu depName=sqitch suite=resolute
  APT_SQITCH: 1.6.1-1
  SCHEMACRAWLER_IMAGE: schemacrawler/schemacrawler:v18.0.2

jobs:
  graph:
    name: Database diagram
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_DB: ci_database
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: ci
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create role secrets
        run: |
          sudo mkdir -p /run/secrets
          for role in gizmosql grafana postgraphile reccoom vibetype zammad; do
            echo "$role" | sudo tee "/run/secrets/postgres-role-service-${role}-username" > /dev/null
            echo "placeholder" | sudo tee "/run/secrets/postgres-role-service-${role}-password" > /dev/null
          done

      - name: Install Sqitch
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y sqitch=${{ env.APT_SQITCH }}

      - name: Deploy migrations
        run: sqitch --chdir src deploy --target db:pg://ci:postgres@localhost/ci_database

      # The PNG differs on every render, so the DOT source (minus its timestamp) decides whether the diagram changed.
      - name: Render diagram
        run: |
          crawl() {
            docker run --rm --network=host --user "$(id -u):$(id -g)" -v "$PWD/docs/resources:/out" \
              --entrypoint schemacrawler "$SCHEMACRAWLER_IMAGE" \
              --server=postgresql --host=localhost --database=ci_database --user=ci --password=postgres \
              --command=schema --info-level=maximum --schemas='vibetype.*' "$@"
          }
          crawl --output-format=dot --output-file=/out/graph.dot
          sed -i '/<td align=.left.>[0-9-]\{10\} [0-9:]\{8\}<\/td>/d' docs/resources/graph.dot
          if [ -z "$(git status --porcelain -- docs/resources/graph.dot)" ]; then
            echo "Diagram unchanged."
          else
            crawl --output-format=png --output-file=/out/graph.png
          fi

      - name: Open pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          add-paths: docs/resources/graph.*
          body: Regenerated the database diagram from the current migrations.
          branch: docs/resources/graph
          commit-message: "docs(resources): update graph"
          delete-branch: true
          title: "docs(resources): update graph"
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
